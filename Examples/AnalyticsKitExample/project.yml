name: AnalyticsKitExample
options:
  bundleIdPrefix: com.nangnguyendev
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  AnalyticsKit:
    path: ../..
targets:
  AnalyticsKitExample:
    type: application
    platform: iOS
    sources:
      - path: AnalyticsKitExample
    dependencies:
      - package: AnalyticsKit
        product: AnalyticsKit
      - package: AnalyticsKit
        product: AnalyticsKitFirebase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nangnguyendev.AnalyticsKitExample
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: AnalyticsKit
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: -ObjC
schemes:
  AnalyticsKitExample:
    build:
      targets:
        AnalyticsKitExample: all
    run:
      config: Debug
      commandLineArguments:
        "-FIRDebugEnabled": true
